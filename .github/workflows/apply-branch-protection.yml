on:
  workflow_dispatch:

jobs:
  apply-protection:
    runs-on: ubuntu-latest
    steps:
      - name: Apply branch protection to main and develop
        uses: actions/github-script@v6
        with:
          github-token: ${{ secrets.PROTECTION_TOKEN }}
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const branches = [
              { name: 'main', reviews: 2 },
              { name: 'develop', reviews: 1 }
            ];
            for (const b of branches) {
              const params = {
                owner,
                repo,
                branch: b.name,
                required_status_checks: null,
                enforce_admins: true,
                required_pull_request_reviews: {
                  dismiss_stale_reviews: true,
                  require_code_owner_reviews: false,
                  required_approving_review_count: b.reviews
                },
                restrictions: {
                  users: [],
                  teams: [],
                  apps: []
                }
              };
              await github.request('PUT /repos/{owner}/{repo}/branches/{branch}/protection', params);
              console.log(`Branch protection applied to ${owner}/${repo} branch ${b.name}`);
            }
